version: "3.8"
services:
  # Existing TeknoFixHub services preserved
  mongodb:
    image: mongo:6.0
    container_name: teknofixhub-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    volumes:
      - mongo_data:/data/db
    networks:
      - teknofixhub-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: teknofixhub-backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      MONGO_URI: mongodb://admin:admin123@mongodb:27017/teknofixhub
      JWT_SECRET: your_secret_key
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
    networks:
      - teknofixhub-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: teknofixhub-frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - teknofixhub-network

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: teknofixhub-admin
    ports:
      - "3001:3001"
    environment:
      VITE_API_URL: http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - teknofixhub-network

  postgres:
    image: postgres:15
    container_name: teknofixhub-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: teknofixhub
      POSTGRES_PASSWORD: teknofixhub123
      POSTGRES_DB: teknofixhub
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - teknofixhub-network

  redis:
    image: redis:7
    container_name: teknofixhub-redis
    ports:
      - "6379:6379"
    networks:
      - teknofixhub-network

  nginx:
    image: nginx:latest
    container_name: teknofixhub-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./public:/usr/share/nginx/html
    depends_on:
      - backend
      - frontend
      - admin
    networks:
      - teknofixhub-network

  # Static site for Blog-Keren
  web:
    build: .
    image: blog-keren-web:latest
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  mongo_data:
  postgres_data:

networks:
  teknofixhub-network:
    driver: bridge
