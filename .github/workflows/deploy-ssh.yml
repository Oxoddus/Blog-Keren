name: Build & Deploy to SSH Server

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/blog-keren:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/blog-keren:latest
          platforms: linux/amd64,linux/arm64

      - name: Deploy to server over SSH (docker-compose)
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -eux
            IMAGE=ghcr.io/${{ github.repository_owner }}/blog-keren:latest
            DEPLOY_DIR=~/blog-keren
            mkdir -p "$DEPLOY_DIR"
            cat > "$DEPLOY_DIR/docker-compose.yml" <<'EOF'
version: "3.8"
services:
  web:
    image: ${IMAGE}
    restart: unless-stopped
    ports:
      - "8080:80"
EOF
            # Login to GHCR if credentials provided
            if [ -n "${{ secrets.GHCR_PAT }}" ]; then
              echo "Logging in to GHCR"
              echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin || true
            fi

            docker compose -f "$DEPLOY_DIR/docker-compose.yml" pull
            docker compose -f "$DEPLOY_DIR/docker-compose.yml" up -d

            # Wait for HTTP health (timeout ~60s)
            for i in $(seq 1 30); do
              if curl -fsS --max-time 5 http://localhost:8080/ >/dev/null 2>&1; then
                echo "Service reachable"
                break
              fi
              echo "Waiting for service... ($i/30)"
              sleep 2
            done
            if ! curl -fsS --max-time 5 http://localhost:8080/ >/dev/null 2>&1; then
              echo "Service did not become healthy" >&2
              exit 1
            fi
